# SLO 6 : débit effectif = tokens de sortie / durée totale de l'appel, bout en bout (prompt processing inclus, ce n'est pas le débit de génération pur). Seuil prudent pour qwen2.5:3b sur CPU, à recalibrer après mesure. Agrège tous les moteurs et modèles (engine, model retirés).
# Collecte : ServiceMonitor du chart war-room (metrics.enabled=true). Appliquer : kubectl apply -n sre-war-room -f observability/sloth/war-room-llm-throughput.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: war-room-llm-throughput
spec:
  service: war-room-llm
  slos:
    - name: throughput
      objective: 90
      description: "Les appels au modèle ont un débit effectif d'au moins 1 token/s."
      sli:
        events:
          errorQuery: sum(rate(war_room_npc_llm_effective_tokens_per_second_count[{{.window}}])) - (sum(rate(war_room_npc_llm_effective_tokens_per_second_bucket{le="1"}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(war_room_npc_llm_effective_tokens_per_second_count[{{.window}}]))
      alerting:
        name: WarRoomLlmThroughput
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
