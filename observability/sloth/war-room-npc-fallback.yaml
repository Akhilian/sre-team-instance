# SLO 3 : réponses PNJ sans repli, moteurs à modèle seulement . capped (plafond atteint) et rejected_repeat (anti-répétition) sont exclus du total.
# Collecte : ServiceMonitor du chart war-room (metrics.enabled=true). Appliquer : kubectl apply -n sre-war-room -f observability/sloth/war-room-npc-fallback.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: war-room-npc-fallback
spec:
  service: war-room-npc
  slos:
    - name: npc-fallback
      objective: 95
      description: "Les réponses des PNJ viennent du modèle, sans repli sur les mots-clés."
      sli:
        events:
          errorQuery: sum(rate(war_room_npc_replies_total{engine!="keywords",outcome=~"fallback|timeout"}[{{.window}}])) or vector(0)
          totalQuery: sum(rate(war_room_npc_replies_total{engine!="keywords",outcome=~"ok|fallback|timeout"}[{{.window}}]))
      alerting:
        name: WarRoomNpcFallback
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
