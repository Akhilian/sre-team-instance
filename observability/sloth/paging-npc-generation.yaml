# SLO 4 : 90 % des générations du moteur à modèle en moins de 10 s. Mesure l'appel au moteur seul : le rythme pédagogique (NPC_PACE) n'y entre jamais.
# Collecte : ServiceMonitor du chart paging (metrics.enabled=true). Appliquer : kubectl apply -n sre-teams -f observability/sloth/paging-npc-generation.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: paging-npc-generation
spec:
  service: paging-npc
  slos:
    - name: npc-generation
      objective: 90
      description: "Le moteur à modèle génère la réponse en moins de 10 s."
      sli:
        events:
          errorQuery: sum(rate(paging_npc_generation_duration_seconds_count{engine!="keywords"}[{{.window}}])) - (sum(rate(paging_npc_generation_duration_seconds_bucket{engine!="keywords",le="10"}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(paging_npc_generation_duration_seconds_count{engine!="keywords"}[{{.window}}]))
      alerting:
        name: PagingNpcGeneration
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
