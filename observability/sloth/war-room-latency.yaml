# SLO 2 : latence de publication, 95 % des POST de message sous 250 ms (bucket le="0.25").
# Collecte : ServiceMonitor du chart war-room (metrics.enabled=true). Appliquer : kubectl apply -n sre-war-room -f observability/sloth/war-room-latency.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: war-room-latency
spec:
  service: war-room-messaging
  slos:
    - name: latency
      objective: 95
      description: "Les messages sont publiés en moins de 250 ms."
      sli:
        events:
          errorQuery: sum(rate(war_room_http_request_duration_seconds_count{method="POST",route="/api/channels/:id/messages"}[{{.window}}])) - (sum(rate(war_room_http_request_duration_seconds_bucket{method="POST",route="/api/channels/:id/messages",le="0.25"}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(war_room_http_request_duration_seconds_count{method="POST",route="/api/channels/:id/messages"}[{{.window}}]))
      alerting:
        name: WarRoomLatency
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
