# SLO 7 : ok / (ok + timeout), terminés sous 60 s (NPC_LLM_TIMEOUT_MS plafonne à 60 s). Distinct du SLO 4 (< 10 s, 90 %), critère de confort.
# Collecte : ServiceMonitor du chart war-room (metrics.enabled=true). Appliquer : kubectl apply -n sre-war-room -f observability/sloth/war-room-llm-deadline.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: war-room-llm-deadline
spec:
  service: war-room-llm
  slos:
    - name: deadline
      objective: 97
      description: "Les appels au modèle se terminent avant le plafond de 60 s."
      sli:
        events:
          errorQuery: sum(rate(war_room_npc_llm_duration_seconds_count{outcome=~"ok|timeout"}[{{.window}}])) - (sum(rate(war_room_npc_llm_duration_seconds_bucket{outcome="ok",le="60"}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(war_room_npc_llm_duration_seconds_count{outcome=~"ok|timeout"}[{{.window}}]))
      alerting:
        name: WarRoomLlmDeadline
        pageAlert:
          labels: { severity: page }
        ticketAlert:
          labels: { severity: ticket }
