services:
  - type: web
    name: sre-war-room
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FACILITATOR_CODE
        sync: false
      # Persistance des conversations (optionnelle) : URL d'un Redis externe (Render Key Value, Upstash…)
      - key: REDIS_URL
        sync: false
      # Fiches des PNJ lues dans un dossier (optionnel, disque persistant requis) : <dir>/<scénario>/<id>.md
      - key: NPC_PERSONAS_DIR
        sync: false
      # Moteur de réponse des PNJ : keywords (défaut du code si vide), openai-compatible ou anthropic (voir README).
      # Saisi dans le tableau de bord : un blueprint ne réécrase pas le choix fait avant l'atelier.
      - key: NPC_ENGINE
        sync: false
      # Rythme de réponse des PNJ : instant, realistic (défaut du code si vide) ou busy ; réglable aussi dans /admin
      - key: NPC_PACE
        sync: false
      # openai-compatible : URL publique ou auto-hébergée de l'API (/v1 compris), modèle et clé éventuelle
      - key: NPC_LLM_BASE_URL
        sync: false
      - key: NPC_LLM_MODEL
        sync: false
      - key: NPC_LLM_API_KEY
        sync: false
      # anthropic : clé d'API Claude (secret) et modèle (défaut claude-haiku-5-5 si vide)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NPC_ANTHROPIC_MODEL
        sync: false
      # DocShare piloté par les scénarios (optionnel) : URL de base et jeton des routes /ops/* (secret, jamais renvoyé au navigateur)
      - key: DOCSHARE_BASE_URL
        sync: false
      - key: DOCSHARE_OPS_TOKEN
        sync: false
      # /metrics (Prometheus) coupé sur Render : l'URL est publique et rien ne le collecte (voir README)
      - key: METRICS_ENABLED
        value: "false"
