services:
  - type: web
    name: sre-team-instance
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FACILITATOR_CODE
        sync: false
      # Persistance des conversations (optionnelle) : URL d'un Redis externe (Render Key Value, Upstash…)
      - key: REDIS_URL
        sync: false
