services:
  - type: web
    name: sre-team-instance
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Vue Router en mode history : toutes les routes sont servies par index.html
      - type: rewrite
        source: /*
        destination: /index.html
