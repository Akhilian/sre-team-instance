services:
  - type: web
    name: sre-team-instance
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FACILITATOR_CODE
        sync: false
      # Persistance des conversations (optionnelle) : URL d'un Redis externe (Render Key Value, Upstash…)
      - key: REDIS_URL
        sync: false
      # Fiches des PNJ lues dans un dossier (optionnel, disque persistant requis) : <dir>/<scénario>/<id>.md
      - key: NPC_PERSONAS_DIR
        sync: false
      # Moteur de réponse des PNJ : keywords (défaut, sans modèle), openai-compatible ou anthropic (voir README)
      - key: NPC_ENGINE
        value: keywords
      # openai-compatible : URL publique ou auto-hébergée de l'API (/v1 compris), modèle et clé éventuelle
      - key: NPC_LLM_BASE_URL
        sync: false
      - key: NPC_LLM_MODEL
        sync: false
      - key: NPC_LLM_API_KEY
        sync: false
      # anthropic : clé d'API Claude (secret) et modèle (défaut claude-haiku-5-5 si vide)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NPC_ANTHROPIC_MODEL
        sync: false
