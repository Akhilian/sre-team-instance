name: Publication de l'image

# Publie l'image sur Docker Hub après chaque CI verte sur main (workflow_run du workflow « CI »),
# ou à la demande (workflow_dispatch, sans condition sur la CI).
# Secret requis : DOCKERHUB_TOKEN (jeton Docker Hub en écriture), secret de dépôt.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_USER: akhilian
  IMAGE: sre-war-room

jobs:
  publish:
    name: Publier l'image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Commit testé par la CI (le github.sha d'un workflow_run est celui de la branche par défaut).
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version de l'application, lue dans package.json (sans préfixe v).
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tags : SHA complet du commit, version de package.json et latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USER }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.COMMIT_SHA }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
