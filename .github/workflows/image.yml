name: Publication de l'image

# Publie l'image sur Docker Hub quand la CI est verte sur main.
# Secret requis : DOCKERHUB_TOKEN (jeton Docker Hub en écriture), secret de dépôt.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "shared/**"
      - "public/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "nuxt.config.*"
      - ".github/workflows/ci.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_USER: akhilian
  IMAGE: sre-teams

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publier l'image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version de l'application, lue dans package.json (sans préfixe v).
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tags : SHA complet du commit, version de package.json et latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USER }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
