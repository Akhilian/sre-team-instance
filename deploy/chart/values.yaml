# Version applicative (label app.kubernetes.io/version) ; garder alignée sur `version` de /api/health (workshop-war-room).
appVersion: "0.1.0"

image:
  repository: sre-war-room
  tag: local
  pullPolicy: IfNotPresent

# Port exposé par le Service LoadBalancer (servicelb de k3s)
service:
  port: 8088
  # Annotations du Service (map). Exemple NLB public sur EKS :
  #   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  annotations: {}
  # Sources autorisées (liste de CIDR), ex. ["1.2.3.4/32"] ; vide = pas de restriction
  loadBalancerSourceRanges: []

# Secrets : obligatoires, JAMAIS commités (--set-string ou variables d'environnement via le Makefile)
facilitatorCode: ""

# Clé d'API Claude, optionnelle (moteur NPC_ENGINE=anthropic)
anthropicApiKey: ""

config:
  NODE_ENV: production
  NPC_ENGINE: keywords

resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 512Mi }

redis:
  enabled: true
  image: redis:7-alpine
  # Mot de passe Redis : obligatoire quand redis.enabled=true
  password: ""
  storageClass: ""   # "" = classe par défaut du cluster
  storageSize: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Fiches de PNJ : files/personas/<scénario>/*.md -> ConfigMap <release>-personas, montée sur
# /etc/sre-war-room/personas (NPC_PERSONAS_DIR).

# Modèle self-hosted (chart llm, même namespace). Désactivé : moteur `config.NPC_ENGINE` (keywords).
llm:
  enabled: false
  baseUrl: http://llm:8080/v1
  model: qwen2.5-3b   # = model.alias du chart llm
  timeoutMs: 60000

# NetworkPolicy en entrée : Redis n'accepte que les pods de l'application (même release)
networkPolicy:
  enabled: true

# Métriques Prometheus (GET /metrics de l'app, voir README) : ServiceMonitor pour le Prometheus de
# kube-prometheus-stack (sre-war-room-monitoring). Désactivé par défaut : il exige les CRD de l'Operator
# (monitoring installé avant) ; activé sur eks (environments/eks/paging.yaml).
metrics:
  enabled: false
  interval: 30s
