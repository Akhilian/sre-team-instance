apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-teams.name" . }}
  labels:
    {{- include "sre-teams.labels" . | nindent 4 }}
type: Opaque
stringData:
  FACILITATOR_CODE: {{ required "facilitatorCode est obligatoire" .Values.facilitatorCode | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis:6379" (required "redis.password est obligatoire" .Values.redis.password) .Release.Name | quote }}
  {{- end }}
  {{- with .Values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
