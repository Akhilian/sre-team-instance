apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "war-room.name" . }}
  labels:
    {{- include "war-room.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: war-room
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "war-room.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "war-room.name" . }}
            - secretRef:
                name: {{ include "war-room.name" . }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if include "war-room.hasPersonas" . }}
          volumeMounts:
            - name: personas
              mountPath: /etc/sre-war-room/personas
              readOnly: true
          {{- end }}
      {{- if include "war-room.hasPersonas" . }}
      volumes:
        - name: personas
          configMap:
            name: {{ .Release.Name }}-personas
            items:
              {{- range $path, $_ := .Files.Glob "files/personas/*/*.md" }}
              {{- $rel := $path | trimPrefix "files/personas/" }}
              - key: {{ $rel | replace "/" "_" }}
                path: {{ $rel }}
              {{- end }}
      {{- end }}
