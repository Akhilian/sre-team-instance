{{- $cfg := deepCopy .Values.config }}
{{- if include "sre-teams.hasPersonas" . }}
{{- $_ := set $cfg "NPC_PERSONAS_DIR" "/etc/sre-teams/personas" }}
{{- end }}
{{- if .Values.llm.enabled }}
{{- $_ := set $cfg "NPC_ENGINE" "openai-compatible" }}
{{- $_ := set $cfg "NPC_LLM_BASE_URL" .Values.llm.baseUrl }}
{{- $_ := set $cfg "NPC_LLM_MODEL" .Values.llm.model }}
{{- $_ := set $cfg "NPC_LLM_TIMEOUT_MS" (toString .Values.llm.timeoutMs) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-teams.name" . }}
  labels:
    {{- include "sre-teams.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $cfg }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
