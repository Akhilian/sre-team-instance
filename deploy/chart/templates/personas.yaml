{{- if include "war-room.hasPersonas" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-personas
  labels:
    {{- include "war-room.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/personas/*/*.md" }}
  {{ $path | trimPrefix "files/personas/" | replace "/" "_" }}: {{ $.Files.Get $path | toJson }}
  {{- end }}
{{- end }}
