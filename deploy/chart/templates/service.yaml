apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-teams.name" . }}
  labels:
    {{- include "sre-teams.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sre-teams
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
